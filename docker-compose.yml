# One command: Postgres with pgvector + the app.   docker compose up --build
services:
  db:
    image: pgvector/pgvector:pg16
    environment: { POSTGRES_PASSWORD: postgres, POSTGRES_DB: floatchat }
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U postgres"], interval: 5s, retries: 10 }
  app:
    build: .
    depends_on: { db: { condition: service_healthy } }
    environment:
      FLOATCHAT_DSN: postgresql://postgres:postgres@db:5432/floatchat
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_BASE_URL: ${LLM_BASE_URL:-https://api.openai.com/v1}
      LLM_MODEL: ${LLM_MODEL:-gpt-4o}
    volumes: ["./data:/app/data:ro"]
    ports: ["8501:8501"]
    command: >
      sh -c "floatchat init && floatchat ingest /app/data && floatchat embed &&
             streamlit run src/floatchat/app.py --server.address 0.0.0.0"
volumes: { pgdata: {} }
