[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "floatchat"
version = "1.0.0"
description = "Conversational access to Argo oceanographic profiles: NetCDF ingestion, pgvector semantic search, tool-using agent."
requires-python = ">=3.10"
dependencies = ["netCDF4>=1.6", "numpy>=1.26", "psycopg[binary]>=3.1", "fastembed>=0.3", "requests>=2.31"]

[project.optional-dependencies]
app = ["streamlit>=1.36", "plotly>=5.20", "pandas>=2.0"]
dev = ["pytest>=8"]

[project.scripts]
floatchat = "floatchat.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
